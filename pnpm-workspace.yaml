minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@sveltejs/kit@3.0.0'
  - '@sveltejs/adapter-static@4.0.0'
overrides:
  # adds support for :target-current: https://github.com/parcel-bundler/lightningcss/releases
  lightningcss: ^1.33.0
supportedArchitectures:
  cpu:
    - arm64
    - x64
  os:
    - darwin
    - linux
    - win32
